            height: 1.25rem;
            cursor: pointer;
            margin-top: 0.1rem;

                <button onclick="openPaper(${i})" class="w-full bg-white hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-400 text-slate-700 font-bold text-base sm:text-lg py-3 sm:py-4 px-4 sm:px-5 rounded-2xl shadow-sm transition-all flex justify-between items-center group">
                    <span class="flex items-center gap-3"><i class="fa-solid fa-file-lines text-blue-400 text-xl"></i> Paper ${i}</span>
                    <span class="text-[10px] sm:text-xs font-semibold text-slate-400 group-hover:text-blue-500 bg-slate-100 group-hover:bg-blue-100 px-2 sm:px-3 py-1 rounded-full">Q ${startQ} - ${endQ} <i class="fa-solid fa-chevron-right ml-1"></i></span>
                </button>
                `;
            }
            menuContainer.innerHTML = html;
        };

        function openPaper(paperNum) {
            currentPaperNum = paperNum;
            document.getElementById('menu-view').classList.add('hidden');
            document.getElementById('exam-view').classList.remove('hidden');
            document.getElementById('results-dashboard').classList.add('hidden');
            document.getElementById('submit-btn').style.display = 'flex';
            
            document.getElementById('paper-title').innerText = "Practice Paper " + paperNum;
            isSubmitted = false;

            currentStartIndex = (paperNum - 1) * 50;
            currentEndIndex = Math.min(currentStartIndex + 50, questionBank.length); // Adjusted for the last paper
            const paperQuestions = questionBank.slice(currentStartIndex, currentEndIndex);

            const container = document.getElementById('questions-container');
            let html = '';

            paperQuestions.forEach((q, index) => {
                const qNum = currentStartIndex + index + 1; 
                const savedAns = sessionStorage.getItem(`te_paper${paperNum}_q${qNum}`);

                html += `
                <div class="question-block bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden" id="q${qNum}">
                    <div class="bg-slate-50 border-b border-slate-100 px-5 sm:px-6 py-3 flex justify-between items-center text-sm font-bold text-slate-500 tracking-wide uppercase">
                        <span>Question ${qNum}</span>
                    </div>
                    <div class="p-5 sm:p-7">
                        <div class="text-base sm:text-lg font-bold text-slate-800 mb-2">${q[1]}</div>
                        <div class="text-sm sm:text-base text-slate-600 font-medium mb-5 sm:mb-6">${q[2]}</div>
                        <div class="space-y-3">
                            <label id="lbl-q${qNum}-1" class="flex items-start gap-4 p-4 rounded-2xl border-2 border-slate-100 hover:border-blue-200 hover:bg-blue-50 cursor-pointer transition">
                                <input type="radio" name="q${qNum}" value="1" onchange="handleAnswerChange()" ${savedAns === '1' ? 'checked' : ''} class="mt-0.5 flex-shrink-0 w-5 h-5 sm:w-auto sm:h-auto">
                                <span class="text-slate-700 font-semibold text-sm sm:text-base leading-snug">${q[3]}</span>
                            </label>
                            <label id="lbl-q${qNum}-2" class="flex items-start gap-4 p-4 rounded-2xl border-2 border-slate-100 hover:border-blue-200 hover:bg-blue-50 cursor-pointer transition">
                                <input type="radio" name="q${qNum}" value="2" onchange="handleAnswerChange()" ${savedAns === '2' ? 'checked' : ''} class="mt-0.5 flex-shrink-0 w-5 h-5 sm:w-auto sm:h-auto">
                                <span class="text-slate-700 font-semibold text-sm sm:text-base leading-snug">${q[4]}</span>
                            </label>
                            <label id="lbl-q${qNum}-3" class="flex items-start gap-4 p-4 rounded-2xl border-2 border-slate-100 hover:border-blue-200 hover:bg-blue-50 cursor-pointer transition">
                                <input type="radio" name="q${qNum}" value="3" onchange="handleAnswerChange()" ${savedAns === '3' ? 'checked' : ''} class="mt-0.5 flex-shrink-0 w-5 h-5 sm:w-auto sm:h-auto">
                                <span class="text-slate-700 font-semibold text-sm sm:text-base leading-snug">${q[5]}</span>
                            </label>
                            <label id="lbl-q${qNum}-4" class="flex items-start gap-4 p-4 rounded-2xl border-2 border-slate-100 hover:border-blue-200 hover:bg-blue-50 cursor-pointer transition">
                                <input type="radio" name="q${qNum}" value="4" onchange="handleAnswerChange()" ${savedAns === '4' ? 'checked' : ''} class="mt-0.5 flex-shrink-0 w-5 h-5 sm:w-auto sm:h-auto">
                                <span class="text-slate-700 font-semibold text-sm sm:text-base leading-snug">${q[6]}</span>
                            </label>
                        </div>
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
            window.scrollTo(0, 0);
            handleAnswerChange(); 
        }

        function goBack() {
            document.getElementById('exam-view').classList.add('hidden');
            document.getElementById('menu-view').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function handleAnswerChange() {
            let answeredCount = 0;
            const paperQuestions = questionBank.slice(currentStartIndex, currentEndIndex);
            const totalInPaper = paperQuestions.length;
            
            paperQuestions.forEach((q, index) => {
                const qNum = currentStartIndex + index + 1;
                const checked = document.querySelector(`input[name="q${qNum}"]:checked`);
                if(checked) {
                    answeredCount++;
                    sessionStorage.setItem(`te_paper${currentPaperNum}_q${qNum}`, checked.value);
                }
            });
            
            document.getElementById('progress-text').innerText = `Answered: ${answeredCount} / ${totalInPaper}`;
            const pct = (answeredCount / totalInPaper) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        function confirmSubmit() {
            const paperQuestions = questionBank.slice(currentStartIndex, currentEndIndex);
            const totalInPaper = paperQuestions.length;
            
            let answeredCount = 0;
            paperQuestions.forEach((q, index) => {
                const qNum = currentStartIndex + index + 1;
                if(document.querySelector(`input[name="q${qNum}"]:checked`)) answeredCount++;
            });

            const msg = document.getElementById('confirm-message');
            
            if(answeredCount < totalInPaper) {
                msg.innerHTML = `You have <strong>${totalInPaper - answeredCount} unanswered</strong> questions. Are you sure you want to grade the exam?`;
            } else {
                msg.innerHTML = "You have answered all questions. Ready to submit?";
            }
            
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
        }

        function processSubmission() {
            closeModal();
            isSubmitted = true;
            document.getElementById('submit-btn').style.display = 'none';
            
            let score = 0;
            let correctCount = 0;
            let wrongCount = 0;
            let skippedCount = 0;

            const paperQuestions = questionBank.slice(currentStartIndex, currentEndIndex);
            const totalInPaper = paperQuestions.length;
            
            paperQuestions.forEach((q, index) => {
                const qNum = currentStartIndex + index + 1;
                const correctAns = q[7]; 
                const selectedRadio = document.querySelector(`input[name="q${qNum}"]:checked`);
                const questionBlock = document.getElementById(`q${qNum}`);
                
                const correctLabel = document.getElementById(`lbl-q${qNum}-${correctAns}`);
                if(correctLabel) {
                    correctLabel.classList.remove('border-slate-100', 'hover:border-blue-200', 'hover:bg-blue-50');
                    correctLabel.classList.add('bg-emerald-50', 'border-emerald-400', 'shadow-sm');
                    correctLabel.innerHTML += ' <span class="ml-auto flex-shrink-0 text-[10px] sm:text-xs font-bold bg-emerald-500 text-white px-2 py-1 rounded">CORRECT</span>';
                }
                
                if (selectedRadio) {
                    const selectedVal = parseInt(selectedRadio.value);
                    if (selectedVal === correctAns) {
                        score++;
                        correctCount++;
                        questionBlock.classList.add('is-correct');
                    } else {
                        wrongCount++;
                        questionBlock.classList.add('is-wrong');
                        const wrongLabel = document.getElementById(`lbl-q${qNum}-${selectedVal}`);
                        if(wrongLabel) {
                            wrongLabel.classList.remove('border-slate-100', 'hover:border-blue-200', 'hover:bg-blue-50');
                            wrongLabel.classList.add('bg-rose-50', 'border-rose-300', 'opacity-70');
                            wrongLabel.innerHTML += ' <span class="ml-auto flex-shrink-0 text-[10px] sm:text-xs font-bold bg-rose-200 text-rose-700 px-2 py-1 rounded">YOUR CHOICE</span>';
                        }
                    }
                } else {
                    skippedCount++;
                    questionBlock.classList.add('is-skipped');
                }
                
                document.querySelectorAll(`input[name="q${qNum}"]`).forEach(r => r.disabled = true);
            });
            
            document.getElementById('res-score').innerText = `${score}/${totalInPaper}`;
            document.getElementById('res-correct').innerText = correctCount;
            document.getElementById('res-wrong').innerText = wrongCount;
            document.getElementById('res-skipped').innerText = skippedCount;
            
            document.getElementById('results-dashboard').classList.remove('hidden');
            window.scrollTo(0, 0);
            
            paperQuestions.forEach((q, index) => {
                sessionStorage.removeItem(`te_paper${currentPaperNum}_q${currentStartIndex + index + 1}`);
            });
        }

        let isReviewMode = false;
        function toggleReviewMode() {
            isReviewMode = !isReviewMode;
            const btn = document.getElementById('btn-review-mistakes');
            const corrects = document.querySelectorAll('.is-correct');
            
            if(isReviewMode) {
                btn.innerHTML = '<i class="fa-solid fa-list"></i> Show All Questions';
                btn.classList.replace('bg-amber-100', 'bg-slate-200');
                btn.classList.replace('text-amber-800', 'text-slate-800');
                corrects.forEach(el => el.classList.add('hidden'));
            } else {
                btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Review Mistakes';
                btn.classList.replace('bg-slate-200', 'bg-amber-100');
                btn.classList.replace('text-slate-800', 'text-amber-800');
                corrects.forEach(el => el.classList.remove('hidden'));
            }
        }
    </script>
</body>
</html>
