<body class="text-slate-800">

    <!-- MENU VIEW -->
    <div id="menu-view" class="max-w-3xl mx-auto pt-8 sm:pt-16 px-4">
        <div class="text-center mb-8 sm:mb-10">
            <div class="inline-flex items-center justify-center w-12 h-12 sm:w-16 sm:h-16 rounded-full bg-indigo-100 text-indigo-600 mb-3 sm:mb-4">
                <i class="fa-solid fa-book-open text-2xl sm:text-3xl"></i>
            </div>
            <h1 class="text-2xl sm:text-4xl font-bold text-slate-900 mb-2 sm:mb-3">T.E.T CDP Question Bank</h1>
            <p class="text-sm sm:text-lg text-slate-600">Select a paper below. Each paper contains 50 questions.</p>
        </div>
        
        <div class="space-y-3 sm:space-y-4 pb-8">
            <button onclick="openPaper(1)" class="w-full bg-white hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-300 text-slate-700 font-semibold text-lg sm:text-xl py-4 sm:py-5 px-4 sm:px-6 rounded-xl shadow-sm transition-all flex justify-between items-center group">
                <span class="flex items-center gap-2 sm:gap-3"><i class="fa-regular fa-file-lines text-indigo-400"></i> Paper 1</span>
                <span class="text-xs sm:text-sm font-normal text-slate-400 group-hover:text-indigo-500">Q 1 - 50 <i class="fa-solid fa-chevron-right ml-1 sm:ml-2"></i></span>
            </button>
            <button onclick="openPaper(2)" class="w-full bg-white hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-300 text-slate-700 font-semibold text-lg sm:text-xl py-4 sm:py-5 px-4 sm:px-6 rounded-xl shadow-sm transition-all flex justify-between items-center group">
                <span class="flex items-center gap-2 sm:gap-3"><i class="fa-regular fa-file-lines text-indigo-400"></i> Paper 2</span>
                <span class="text-xs sm:text-sm font-normal text-slate-400 group-hover:text-indigo-500">Q 51 - 100 <i class="fa-solid fa-chevron-right ml-1 sm:ml-2"></i></span>
            </button>
            <button onclick="openPaper(3)" class="w-full bg-white hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-300 text-slate-700 font-semibold text-lg sm:text-xl py-4 sm:py-5 px-4 sm:px-6 rounded-xl shadow-sm transition-all flex justify-between items-center group">
                <span class="flex items-center gap-2 sm:gap-3"><i class="fa-regular fa-file-lines text-indigo-400"></i> Paper 3</span>
                <span class="text-xs sm:text-sm font-normal text-slate-400 group-hover:text-indigo-500">Q 101 - 150 <i class="fa-solid fa-chevron-right ml-1 sm:ml-2"></i></span>
            </button>
            <button onclick="openPaper(4)" class="w-full bg-white hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-300 text-slate-700 font-semibold text-lg sm:text-xl py-4 sm:py-5 px-4 sm:px-6 rounded-xl shadow-sm transition-all flex justify-between items-center group">
                <span class="flex items-center gap-2 sm:gap-3"><i class="fa-regular fa-file-lines text-indigo-400"></i> Paper 4</span>
                <span class="text-xs sm:text-sm font-normal text-slate-400 group-hover:text-indigo-500">Q 151 - 200 <i class="fa-solid fa-chevron-right ml-1 sm:ml-2"></i></span>
            </button>
            <button onclick="openPaper(5)" class="w-full bg-white hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-300 text-slate-700 font-semibold text-lg sm:text-xl py-4 sm:py-5 px-4 sm:px-6 rounded-xl shadow-sm transition-all flex justify-between items-center group">
                <span class="flex items-center gap-2 sm:gap-3"><i class="fa-regular fa-file-lines text-indigo-400"></i> Paper 5</span>
                <span class="text-xs sm:text-sm font-normal text-slate-400 group-hover:text-indigo-500">Q 201 - 250 <i class="fa-solid fa-chevron-right ml-1 sm:ml-2"></i></span>
            </button>
        </div>
    </div>

    <!-- EXAM VIEW -->
    <div id="exam-view" class="hidden min-h-screen flex flex-col">
        
        <!-- Sticky Header with Timer and Progress -->
        <div class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
            <div class="max-w-4xl mx-auto px-2 sm:px-4 py-2 sm:py-3 flex justify-between items-center gap-2 sm:gap-4">
                
                <div class="flex items-center gap-2 sm:gap-4">
                    <button onclick="goBack()" class="text-slate-500 hover:text-indigo-600 transition flex items-center justify-center w-8 h-8 sm:w-auto sm:h-auto sm:px-3 sm:py-2 rounded-lg bg-slate-100 hover:bg-indigo-50 flex-shrink-0">
                        <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline sm:ml-2 font-medium">Back</span>
                    </button>
                    <div class="min-w-0">
                        <h2 id="paper-title" class="font-bold text-sm sm:text-lg text-slate-800 leading-tight truncate">Paper 1</h2>
                        <div class="text-[10px] sm:text-sm font-medium text-slate-500 whitespace-nowrap" id="progress-text">Answered: 0 / 50</div>
                    </div>
                </div>

                <div class="flex items-center gap-2 sm:gap-4 flex-shrink-0">
                    <!-- Timer -->
                    <div class="bg-slate-800 text-white px-2 py-1.5 sm:px-4 sm:py-2 rounded-lg font-mono font-bold text-sm sm:text-lg flex items-center gap-1.5 sm:gap-2" id="timer-container">
                        <i class="fa-regular fa-clock text-slate-400 text-xs sm:text-base"></i>
                        <span id="timer-display">60:00</span>
                    </div>
                    
                    <button id="submit-btn" onclick="confirmSubmit()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1.5 px-3 sm:py-2 sm:px-6 rounded-lg shadow-sm transition flex items-center gap-1.5 sm:gap-2 text-sm sm:text-base">
                        <i class="fa-solid fa-check-double hidden sm:inline"></i> 
                        <i class="fa-solid fa-check sm:hidden"></i>
                        <span>Submit</span>
                    </button>
                </div>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 h-1.5">
                <div id="progress-bar" class="bg-indigo-600 h-1.5 transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Results Dashboard (Hidden until submitted) -->
        <div id="results-dashboard" class="hidden max-w-4xl mx-auto w-full px-3 sm:px-4 pt-6 sm:pt-8 pb-4">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative">
                <div class="absolute top-0 left-0 w-full h-2 bg-emerald-500"></div>
                <div class="p-4 sm:p-8 text-center">
                    <h2 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-4 sm:mb-6">Exam Complete!</h2>
                    
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 mb-6 sm:mb-8">
                        <div class="bg-indigo-50 rounded-xl p-3 sm:p-4 border border-indigo-100">
                            <div class="text-2xl sm:text-3xl font-bold text-indigo-700" id="res-score">0</div>
                            <div class="text-[10px] sm:text-xs uppercase font-semibold text-indigo-500 mt-1">Total Score</div>
                        </div>
                        <div class="bg-emerald-50 rounded-xl p-3 sm:p-4 border border-emerald-100">
                            <div class="text-2xl sm:text-3xl font-bold text-emerald-700" id="res-correct">0</div>
                            <div class="text-[10px] sm:text-xs uppercase font-semibold text-emerald-500 mt-1">Correct</div>
                        </div>
                        <div class="bg-rose-50 rounded-xl p-3 sm:p-4 border border-rose-100">
                            <div class="text-2xl sm:text-3xl font-bold text-rose-700" id="res-wrong">0</div>
                            <div class="text-[10px] sm:text-xs uppercase font-semibold text-rose-500 mt-1">Incorrect</div>
                        </div>
                        <div class="bg-slate-100 rounded-xl p-3 sm:p-4 border border-slate-200">
                            <div class="text-2xl sm:text-3xl font-bold text-slate-600" id="res-skipped">0</div>
                            <div class="text-[10px] sm:text-xs uppercase font-semibold text-slate-500 mt-1">Skipped</div>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-center gap-3 sm:gap-4">
                        <button onclick="toggleReviewMode()" id="btn-review-mistakes" class="w-full sm:w-auto bg-rose-100 hover:bg-rose-200 text-rose-800 font-semibold py-3 sm:py-2 px-6 rounded-lg transition flex items-center justify-center gap-2 text-sm sm:text-base">
                            <i class="fa-solid fa-filter"></i> Review Mistakes Only
                        </button>
                        <button onclick="goBack()" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 sm:py-2 px-6 rounded-lg transition text-sm sm:text-base">
                            Back to Menu
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Questions Container -->
        <div id="questions-container" class="flex-grow max-w-4xl mx-auto w-full px-3 sm:px-4 py-6 sm:py-8 space-y-4 sm:space-y-6">
            <!-- Questions will be loaded here -->
        </div>

    </div>

    <!-- Custom Confirm Modal -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-slate-900/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-5 sm:p-6 modal-enter">
            <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-xl sm:text-2xl mb-4 mx-auto">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-lg sm:text-xl font-bold text-slate-900 text-center mb-2">Submit Exam?</h3>
            <p class="text-sm sm:text-base text-slate-600 text-center mb-6" id="confirm-message">Are you sure you want to submit?</p>
            
            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="closeModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 sm:py-2.5 rounded-lg transition text-sm sm:text-base order-2 sm:order-1">
                    Keep Checking
                </button>
                <button onclick="processSubmission()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 sm:py-2.5 rounded-lg transition shadow-md text-sm sm:text-base order-1 sm:order-2">
                    Yes, Submit Now
                </button>
            </div>
        </div>
    </div>

    <script>
        // Format: [id, English, Hindi, Opt1, Opt2, Opt3, Opt4, Correct_Answer_Number]

        let currentPaperNum = 1;
        let currentStartIndex = 0;
        let currentEndIndex = 0;
        
        let timerInterval = null;
        let timeRemaining = 3600; // 60 minutes
        let isSubmitted = false;
        let isReviewMode = false;
        let timerKey = '';

        function openPaper(paperNum) {
            currentPaperNum = paperNum;
            document.getElementById('menu-view').classList.add('hidden');
            document.getElementById('exam-view').classList.remove('hidden');
            document.getElementById('results-dashboard').classList.add('hidden');
            document.getElementById('submit-btn').style.display = 'flex';
            
            document.getElementById('paper-title').innerText = "Practice Paper " + paperNum;
            isSubmitted = false;
            isReviewMode = false;
            resetReviewButton();

            currentStartIndex = (paperNum - 1) * 50;
            timerKey = `cdp_timer_paper${paperNum}`;
            currentEndIndex = currentStartIndex + 50;
            const paperQuestions = questionBank.slice(currentStartIndex, currentEndIndex);

            const container = document.getElementById('questions-container');
            let html = '';

            paperQuestions.forEach((q, index) => {
                const qNum = currentStartIndex + index + 1; // Real question number (1 to 250)
                
                // Retrieve saved answer if any
                const savedAns = sessionStorage.getItem(`paper${paperNum}_q${qNum}`);

                html += `
                <div class="question-block bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden" id="q${qNum}">
                    <div class="bg-slate-50 border-b border-slate-100 px-4 sm:px-6 py-2 sm:py-3 flex justify-between items-center text-xs sm:text-sm font-bold text-slate-500">
                        <span>Question ${index + 1}</span>
                    </div>
                    <div class="p-4 sm:p-6">
                        <div class="text-base sm:text-lg font-bold text-slate-800 mb-2">${q[1]}</div>
                        <div class="text-sm sm:text-base text-slate-600 mb-4 sm:mb-6">${q[2]}</div>
                        <div class="space-y-2 sm:space-y-3">
                            <label id="lbl-q${qNum}-1" class="flex items-start gap-3 sm:gap-4 p-3 sm:p-4 rounded-xl border border-slate-200 hover:border-indigo-300 hover:bg-slate-50 cursor-pointer transition">
                                <input type="radio" name="q${qNum}" value="1" onchange="handleAnswerChange()" ${savedAns === '1' ? 'checked' : ''} class="mt-0.5 sm:mt-1 flex-shrink-0 w-4 h-4 sm:w-5 sm:h-5">
                                <span class="text-slate-700 font-medium text-sm sm:text-base leading-snug pt-0.5">(1) ${q[3]}</span>
                            </label>
                            <label id="lbl-q${qNum}-2" class="flex items-start gap-3 sm:gap-4 p-3 sm:p-4 rounded-xl border border-slate-200 hover:border-indigo-300 hover:bg-slate-50 cursor-pointer transition">
                                <input type="radio" name="q${qNum}" value="2" onchange="handleAnswerChange()" ${savedAns === '2' ? 'checked' : ''} class="mt-0.5 sm:mt-1 flex-shrink-0 w-4 h-4 sm:w-5 sm:h-5">
                                <span class="text-slate-700 font-medium text-sm sm:text-base leading-snug pt-0.5">(2) ${q[4]}</span>
                            </label>
                            <label id="lbl-q${qNum}-3" class="flex items-start gap-3 sm:gap-4 p-3 sm:p-4 rounded-xl border border-slate-200 hover:border-indigo-300 hover:bg-slate-50 cursor-pointer transition">
                                <input type="radio" name="q${qNum}" value="3" onchange="handleAnswerChange()" ${savedAns === '3' ? 'checked' : ''} class="mt-0.5 sm:mt-1 flex-shrink-0 w-4 h-4 sm:w-5 sm:h-5">
                                <span class="text-slate-700 font-medium text-sm sm:text-base leading-snug pt-0.5">(3) ${q[5]}</span>
                            </label>
                            <label id="lbl-q${qNum}-4" class="flex items-start gap-3 sm:gap-4 p-3 sm:p-4 rounded-xl border border-slate-200 hover:border-indigo-300 hover:bg-slate-50 cursor-pointer transition">
                                <input type="radio" name="q${qNum}" value="4" onchange="handleAnswerChange()" ${savedAns === '4' ? 'checked' : ''} class="mt-0.5 sm:mt-1 flex-shrink-0 w-4 h-4 sm:w-5 sm:h-5">
                                <span class="text-slate-700 font-medium text-sm sm:text-base leading-snug pt-0.5">(4) ${q[6]}</span>
                            </label>
                        </div>
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
            window.scrollTo(0, 0);
            
            handleAnswerChange(); // init progress
            startTimer();
        }

        function goBack() {
            clearInterval(timerInterval);
            closeModal();
            isSubmitted = false;
            isReviewMode = false;
            resetReviewButton();

            document.getElementById('confirm-modal').classList.add('hidden');
            document.getElementById('exam-view').classList.add('hidden');
            document.getElementById('menu-view').classList.remove('hidden');
        }

        function startTimer() {
            clearInterval(timerInterval);

            const savedTime = Number(sessionStorage.getItem(timerKey));
            timeRemaining = Number.isFinite(savedTime) && savedTime > 0 ? savedTime : 3600;
            updateTimerDisplay();
            updateTimerWarning();

            timerInterval = setInterval(() => {
                timeRemaining = Math.max(0, timeRemaining - 1);
                sessionStorage.setItem(timerKey, String(timeRemaining));
                updateTimerDisplay();
                updateTimerWarning();

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    processSubmission(true);
                }
            }, 1000);
        }

        function updateTimerWarning() {
            const timer = document.getElementById('timer-container');
            if (!timer) return;

            if (timeRemaining <= 300) {
                timer.classList.remove('bg-slate-800');
                timer.classList.add('bg-rose-600', 'animate-pulse');
            } else {
                timer.classList.remove('bg-rose-600', 'animate-pulse');
                timer.classList.add('bg-slate-800');
            }
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            const s = (timeRemaining % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').textContent = `${m}:${s}`;
        }

        function handleAnswerChange() {
            // Count answered questions
            let answeredCount = 0;
            const paperQuestions = questionBank.slice(currentStartIndex, currentEndIndex);
            
            paperQuestions.forEach((q, index) => {
                const qNum = currentStartIndex + index + 1;
                const checked = document.querySelector(`input[name="q${qNum}"]:checked`);
                if(checked) {
                    answeredCount++;
                    // Save to session so they don't lose work on reload
                    sessionStorage.setItem(`paper${currentPaperNum}_q${qNum}`, checked.value);
                }
            });
            
            document.getElementById('progress-text').innerText = `Answered: ${answeredCount} / 50`;
            const pct = (answeredCount / 50) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        function confirmSubmit() {
            const answeredCount = document.querySelectorAll('input[type="radio"]:checked').length;
            const msg = document.getElementById('confirm-message');
            
            if(answeredCount < 50) {
                msg.innerHTML = `You have <strong>${50 - answeredCount} unanswered</strong> questions. Are you sure you want to grade the exam?`;
            } else {
                msg.innerHTML = "You have answered all questions. Ready to submit?";
            }
            
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
        }

        function processSubmission(autoSubmit = false) {
            if (isSubmitted) return;
            closeModal();
            clearInterval(timerInterval);
            isSubmitted = true;
            sessionStorage.removeItem(timerKey);
            document.getElementById('submit-btn').style.display = 'none';
            document.getElementById('timer-container').classList.replace('bg-rose-600', 'bg-slate-800');
            document.getElementById('timer-container').classList.remove('animate-pulse');
            
            let score = 0;
            let correctCount = 0;
            let wrongCount = 0;
            let skippedCount = 0;

            const paperQuestions = questionBank.slice(currentStartIndex, currentEndIndex);
            
            paperQuestions.forEach((q, index) => {
                const qNum = currentStartIndex + index + 1;
                const correctAns = q[7];
                const selectedRadio = document.querySelector(`input[name="q${qNum}"]:checked`);
                const questionBlock = document.getElementById(`q${qNum}`);
                
                // Highlight correct answer in green
                const correctLabel = document.getElementById(`lbl-q${qNum}-${correctAns}`);
                if(correctLabel) {
                    correctLabel.classList.add('bg-emerald-50', 'border-emerald-500', 'ring-1', 'sm:ring-2', 'ring-emerald-200');
                    correctLabel.innerHTML += ' <span class="ml-auto flex-shrink-0 text-[10px] sm:text-xs font-bold bg-emerald-500 text-white px-2 py-1 rounded">CORRECT</span>';
                }
                
                if (selectedRadio) {
                    const selectedVal = parseInt(selectedRadio.value);
                    if (selectedVal === correctAns) {
                        score++;
                        correctCount++;
                        questionBlock.classList.add('is-correct'); // Used for filtering
                    } else {
                        wrongCount++;
                        questionBlock.classList.add('is-wrong');
                        // Highlight user's wrong answer in red
                        const wrongLabel = document.getElementById(`lbl-q${qNum}-${selectedVal}`);
                        if(wrongLabel) {
                            wrongLabel.classList.add('bg-rose-50', 'border-rose-300', 'opacity-70', 'line-through');
                            wrongLabel.innerHTML += ' <span class="ml-auto flex-shrink-0 text-[10px] sm:text-xs font-bold bg-rose-200 text-rose-700 px-2 py-1 rounded no-underline">YOUR CHOICE</span>';
                        }
                    }
                } else {
                    skippedCount++;
                    questionBlock.classList.add('is-skipped');
                }
                
                // Disable all radio buttons
                document.querySelectorAll(`input[name="q${qNum}"]`).forEach(r => r.disabled = true);
            });
            
            // Populate and show dashboard
            document.getElementById('res-score').innerText = `${score}/50`;
            document.getElementById('res-correct').innerText = correctCount;
            document.getElementById('res-wrong').innerText = wrongCount;
            document.getElementById('res-skipped').innerText = skippedCount;
            
            document.getElementById('results-dashboard').classList.remove('hidden');
            window.scrollTo(0, 0);
            
            // Clear session storage for this paper so they can retake it fresh next time
            paperQuestions.forEach((q, index) => {
                sessionStorage.removeItem(`paper${currentPaperNum}_q${currentStartIndex + index + 1}`);
            });
        }

        function resetReviewButton() {
            const btn = document.getElementById('btn-review-mistakes');
            if (!btn) return;
            btn.innerHTML = '<i class="fa-solid fa-filter"></i> Review Mistakes Only';
            btn.classList.remove('bg-slate-200', 'text-slate-800');
            btn.classList.add('bg-rose-100', 'text-rose-800');
        }

        function toggleReviewMode() {
            isReviewMode = !isReviewMode;
            const btn = document.getElementById('btn-review-mistakes');
            const corrects = document.querySelectorAll('.is-correct');
            
            if(isReviewMode) {
                btn.innerHTML = '<i class="fa-solid fa-list"></i> Show All Questions';
                btn.classList.replace('bg-rose-100', 'bg-slate-200');
                btn.classList.replace('text-rose-800', 'text-slate-800');
                corrects.forEach(el => el.classList.add('hidden'));
            } else {
                btn.innerHTML = '<i class="fa-solid fa-filter"></i> Review Mistakes Only';
                btn.classList.replace('bg-slate-200', 'bg-rose-100');
                btn.classList.replace('text-slate-800', 'text-rose-800');
                corrects.forEach(el => el.classList.remove('hidden'));
            }
        }
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeModal();
        });

        resetReviewButton();
    </script>
</body>
</html>
